<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-icon.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BuilderConnect - Smart Construction Marketplace & Project Lifecycle Management Platform" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&display=swap" rel="stylesheet">
    <script>
      // Apply stored dark theme before first paint to avoid a light flash
      try {
        if (localStorage.getItem('theme.v2') === 'dark') {
          document.documentElement.classList.add('dark')
        }
      } catch (e) { /* storage unavailable — default light */ }
    </script>
    <title>BuilderConnect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Unregister any stale service workers — breaks Vite HMR and caches outdated assets
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          registrations.forEach(function(registration) { registration.unregister() })
        })
      }
    </script>
  </body>
</html>
